name: Android Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate semantic version and main ancestry
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit contained in main."
            exit 1
          fi

  build-aab:
    name: Build Signed Android AAB
    needs:
      - validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: ${{ runner.os }}-unity-Android-release-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-unity-Android-release-

      - name: Build signed Android App Bundle
        id: build
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          targetPlatform: Android
          androidExportType: androidAppBundle
          versioning: Tag
          androidKeystoreName: upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME || secrets.KEY_ALIAS_NAME || 'tessellation' }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS || secrets.KEY_ALIAS_PASS }}
          buildsPath: build

      - name: Locate and verify AAB
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t bundles < <(find build/Android -type f -name '*.aab' -print)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "Expected exactly one AAB, found ${#bundles[@]}."
            exit 1
          fi

          jarsigner -verify "${bundles[0]}"
          mkdir -p release
          destination="release/HoneyComb0-${GITHUB_REF_NAME}.aab"
          cp "${bundles[0]}" "$destination"
          echo "path=$destination" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-${{ github.ref_name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          AAB_PATH: ${{ steps.artifact.outputs.path }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "Published release $TAG_NAME is immutable. Create a new patch tag instead."
              exit 1
            fi
            gh release upload "$TAG_NAME" "$AAB_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$AAB_PATH" \
              --draft \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes
          fi
