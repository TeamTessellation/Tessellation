name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - ci/android-release-pipeline

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate branch name and PR title
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          branch_pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore|hotfix)/([0-9]+-)?[a-z0-9]+(-[a-z0-9]+)*$'
          title_pattern='^(feat|fix|refactor|perf|docs|test|build|ci|chore|hotfix)(\([a-z0-9._-]+\))?: .+'

          if [[ "$BRANCH_NAME" != dependabot/* && ! "$BRANCH_NAME" =~ $branch_pattern ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Expected: <type>/<optional-issue-number>-<kebab-case>"
            exit 1
          fi

          if [[ ! "$PR_TITLE" =~ $title_pattern ]]; then
            echo "Invalid PR title: $PR_TITLE"
            echo "Expected: <type>(<optional-scope>): <description>"
            exit 1
          fi

      - name: Reject tracked signing credentials
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -Eiq '(^|/)(KeyStore/|[^/]+\.(keystore|jks|p12|pem)$)'; then
            echo "Signing credentials must not be tracked by Git."
            git ls-files | grep -Ei '(^|/)(KeyStore/|[^/]+\.(keystore|jks|p12|pem)$)'
            exit 1
          fi

  unity-tests:
    name: Unity Tests (${{ matrix.displayName }})
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - testMode: editmode
            displayName: EditMode
          - testMode: playmode
            displayName: PlayMode
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: ${{ runner.os }}-unity-${{ matrix.testMode }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-unity-${{ matrix.testMode }}-

      - name: Run Unity tests
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.displayName }} Test Results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-test-results-${{ matrix.testMode }}
          path: artifacts/${{ matrix.testMode }}
          if-no-files-found: warn
          retention-days: 14

  android-signing:
    name: Android Signing
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.validate.outputs.available }}
    steps:
      - name: Validate Android signing configuration
        id: validate
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.KEYSTORE_PASS }}
          RELEASE_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME || secrets.KEY_ALIAS_NAME || 'tessellation' }}
          RELEASE_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS || secrets.KEY_ALIAS_PASS }}
        run: |
          missing=()
          [[ -n "$RELEASE_KEYSTORE_BASE64" ]] || missing+=("ANDROID_KEYSTORE_BASE64 (or KEYSTORE_BASE64)")
          [[ -n "$RELEASE_KEYSTORE_PASS" ]] || missing+=("ANDROID_KEYSTORE_PASS (or KEYSTORE_PASS)")
          [[ -n "$RELEASE_KEYALIAS_PASS" ]] || missing+=("ANDROID_KEYALIAS_PASS (or KEY_ALIAS_PASS)")

          if (( ${#missing[@]} == 3 )); then
            echo '::notice title=Android test signing::Release signing secrets are not available; the CI APK will use the Unity debug keystore. Tagged release builds still require release signing.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( ${#missing[@]} )); then
            printf '::error title=Android signing secret missing::Missing repository secret: %s\n' "${missing[@]}"
            exit 1
          fi

          keystore="$RUNNER_TEMP/tessellation-release.keystore"
          if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"; then
            echo '::error title=Invalid Android keystore::The Android keystore secret is not valid Base64.'
            exit 1
          fi

          if ! keytool -list \
            -keystore "$keystore" \
            -storepass "$RELEASE_KEYSTORE_PASS" \
            -alias "$RELEASE_KEYALIAS_NAME" >/dev/null 2>&1; then
            echo '::error title=Android signing mismatch::The Android keystore password or alias does not match the registered keystore.'
            exit 1
          fi

          echo 'available=true' >> "$GITHUB_OUTPUT"

  android-release-apk:
    name: Android Release APK
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      needs.android-signing.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || needs.unity-tests.result == 'success')
    needs:
      - unity-tests
      - android-signing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: ${{ runner.os }}-unity-Android-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-unity-Android-

      - name: Use debug signing for test release APK
        if: needs.android-signing.outputs.available != 'true'
        shell: bash
        run: |
          sed -i 's/^  androidUseCustomKeystore: 1$/  androidUseCustomKeystore: 0/' ProjectSettings/ProjectSettings.asset
          sed -i 's/^    Android: 1$/    Android: 0/' ProjectSettings/ProjectSettings.asset
          sed -i 's/^  AndroidTargetArchitectures: 2$/  AndroidTargetArchitectures: 1/' ProjectSettings/ProjectSettings.asset
          find 'Assets/Settings/Build Profiles' -type f -name '*.asset' \
            -exec sed -i \
              -e "s/^    - line: '|     Android: 1'$/    - line: '|     Android: 0'/" \
              -e "s/^    - line: '|   AndroidTargetArchitectures: 2'$/    - line: '|   AndroidTargetArchitectures: 1'/" {} +
          grep -q '^  androidUseCustomKeystore: 0$' ProjectSettings/ProjectSettings.asset
          grep -q '^  AndroidTargetArchitectures: 1$' ProjectSettings/ProjectSettings.asset
          grep -A1 '^  scriptingBackend:$' ProjectSettings/ProjectSettings.asset | grep -q '^    Android: 0$'

      - name: Build signed Android release APK
        if: needs.android-signing.outputs.available == 'true'
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          targetPlatform: Android
          androidExportType: androidPackage
          versioning: Custom
          version: 0.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS || secrets.KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME || secrets.KEY_ALIAS_NAME || 'tessellation' }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS || secrets.KEY_ALIAS_PASS }}
          buildsPath: build

      - name: Build test Android release APK (Mono)
        if: needs.android-signing.outputs.available != 'true'
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          targetPlatform: Android
          androidExportType: androidPackage
          versioning: Custom
          version: 0.0.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          buildsPath: build

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release-apk-${{ github.sha }}
          path: build/Android
          if-no-files-found: error
          retention-days: 14
