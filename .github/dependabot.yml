version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    groups:
      github-actions:
        patterns:
          - '*'
    # Without a prefix Dependabot opens pull requests titled "Bump ...", which the
    # Policy check rejects for not being a Conventional Commit.
    commit-message:
      prefix: build
